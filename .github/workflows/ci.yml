name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r lakehouse/requirements.txt pytest
      - name: End-to-end pipeline tests on the mock payload (no network, no upload)
        working-directory: lakehouse
        run: python -m pytest -q tests
